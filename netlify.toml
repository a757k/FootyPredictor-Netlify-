[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/football/*"
  to = "/.netlify/functions/football-api"
  status = 200

[[redirects]]
  from = "/api/football-data/*"
  to = "/.netlify/functions/football-data"
  status = 200

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin-auth"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
